manifest:
  name: web-scraper
  version: 1.0.0
  description: |
    Web scraping and HTTP request tools for fetching and analyzing web content.
    Useful for gathering information from websites, APIs, and online resources.
  author: Kitty Team
  license: MIT
  main: index.js

code: |
  /**
   * Web Scraper Plugin for Kitty
   * 
   * Provides tools for making HTTP requests and scraping web content.
   */

  import { lookup } from 'node:dns/promises';
  import net from 'node:net';

  const FETCH_TIMEOUT_MS = 15000;

  /** True for loopback, private, link-local (cloud metadata), CGNAT and other non-public addresses. */
  function isPrivateAddress(address) {
    if (net.isIPv4(address)) {
      const [a, b] = address.split('.').map(Number);
      return a === 0 || a === 10 || a === 127 ||
        (a === 100 && b >= 64 && b <= 127) ||
        (a === 169 && b === 254) ||
        (a === 172 && b >= 16 && b <= 31) ||
        (a === 192 && b === 168) ||
        a >= 224;
    }
    const v6 = address.toLowerCase();
    if (v6.startsWith('::ffff:')) return isPrivateAddress(v6.slice(7));
    return v6 === '::' || v6 === '::1' ||
      v6.startsWith('fc') || v6.startsWith('fd') ||
      v6.startsWith('fe8') || v6.startsWith('fe9') || v6.startsWith('fea') || v6.startsWith('feb');
  }

  /**
   * Reject URLs that point at this machine or the internal network, so a
   * prompt-injected request can't read cloud metadata or local services.
   * Note: DNS can still change between this check and the fetch (rebinding);
   * do not rely on this plugin in environments with sensitive internal services.
   */
  async function assertPublicUrl(rawUrl) {
    let url;
    try {
      url = new URL(rawUrl);
    } catch {
      throw new Error('Invalid URL');
    }
    if (url.protocol !== 'http:' && url.protocol !== 'https:') {
      throw new Error('Only http and https URLs are allowed');
    }
    const host = url.hostname.replace(/^\[|\]$/g, '');
    const addresses = net.isIP(host) ? [{ address: host }] : await lookup(host, { all: true });
    if (addresses.length === 0 || addresses.some(entry => isPrivateAddress(entry.address))) {
      throw new Error(`Refusing to fetch ${url.hostname}: it resolves to a private or local address`);
    }
    return url;
  }

  export const tools = [
    {
      name: 'fetch_url',
      description: 'Fetch content from a URL. Supports various HTTP methods and headers.',
      inputSchema: {
        type: 'object',
        properties: {
          url: {
            type: 'string',
            description: 'The URL to fetch'
          },
          method: {
            type: 'string',
            enum: ['GET', 'POST', 'PUT', 'DELETE', 'HEAD'],
            description: 'HTTP method (default: GET)'
          },
          headers: {
            type: 'object',
            description: 'Optional HTTP headers'
          },
          body: {
            type: 'string',
            description: 'Request body (for POST/PUT)'
          }
        },
        required: ['url']
      },
      execute: async (params) => {
        try {
          const url = await assertPublicUrl(params.url);
          const options = {
            method: params.method || 'GET',
            headers: params.headers || {},
            // Redirects are not followed: the target could be an internal address.
            // The model can call fetch_url again with the Location header, which is checked.
            redirect: 'manual',
            signal: AbortSignal.timeout(FETCH_TIMEOUT_MS)
          };
          
          if (params.body && (params.method === 'POST' || params.method === 'PUT')) {
            options.body = params.body;
          }
          
          const response = await fetch(url, options);
          const content = await response.text();
          
          return JSON.stringify({
            status: response.status,
            statusText: response.statusText,
            headers: Object.fromEntries(response.headers.entries()),
            body: content.substring(0, 10000) // Limit to first 10KB
          }, null, 2);
        } catch (error) {
          return `Error fetching URL: ${error.message}`;
        }
      }
    },
    {
      name: 'parse_html',
      description: 'Extract text content and metadata from HTML. You MUST specify what to extract using the extract parameter (text, title, links, or meta).',
      inputSchema: {
        type: 'object',
        properties: {
          html: {
            type: 'string',
            description: 'HTML content to parse'
          },
          extract: {
            type: 'string',
            enum: ['text', 'title', 'links', 'meta'],
            description: 'What to extract from the HTML. Required. Use "text" to get readable content, "title" for page title, "links" for all URLs, or "meta" for metadata.'
          }
        },
        required: ['html', 'extract']
      },
      execute: async (params) => {
        try {
          const html = params.html;
          const extract = params.extract;
          
          // Validate extract parameter
          if (!extract || !['text', 'title', 'links', 'meta'].includes(extract)) {
            return `Error: extract parameter is required and must be one of: text, title, links, meta. Received: ${extract}`;
          }
          
          switch (extract) {
            case 'title':
              const titleMatch = html.match(/<title>(.*?)<\/title>/i);
              return titleMatch ? titleMatch[1] : 'No title found';
              
            case 'text':
              // Simple HTML tag removal
              const text = html
                .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                .replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '')
                .replace(/<[^>]+>/g, '')
                .replace(/\s+/g, ' ')
                .trim();
              return text.substring(0, 5000); // Limit output
              
            case 'links':
              const linkRegex = /<a\s+(?:[^>]*?\s+)?href=(["'])(.*?)\1/gi;
              const links = [];
              let match;
              while ((match = linkRegex.exec(html)) !== null) {
                links.push(match[2]);
              }
              return JSON.stringify(links.slice(0, 50), null, 2);
              
            case 'meta':
              const metaRegex = /<meta\s+(?:name|property)=(["'])([^"']+)\1\s+content=(["'])([^"']+)\3/gi;
              const meta = {};
              while ((match = metaRegex.exec(html)) !== null) {
                meta[match[2]] = match[4];
              }
              return JSON.stringify(meta, null, 2);
              
            default:
              return 'Invalid extract type';
          }
        } catch (error) {
          return `Error parsing HTML: ${error.message}`;
        }
      }
    }
  ];
